<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  (function () {
    try {
      var m = localStorage.getItem("rowdo-theme") || "system";
      var d =
        m === "dark" ||
        (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (d) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<title>Page not found · Rowdo</title>
<link rel="stylesheet" href="build/css/app.css" />
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
</head>
<body class="min-h-screen bg-background font-sans text-foreground antialiased">

  <div class="flex min-h-screen flex-col items-center justify-center px-4 py-12">

    <a href="index.html" class="mb-8 flex items-center gap-2">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-primary text-base font-bold text-primary-foreground">R</span>
      <span class="text-xl font-bold tracking-tight">Rowdo</span>
    </a>

    <div class="w-full max-w-sm rounded-xl border border-border bg-card p-8 text-center shadow-sm">
      <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-muted">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path stroke-linecap="round" d="M15.35 15.35 21 21" />
          <path stroke-linecap="round" d="M8.25 8.25 12.75 12.75M12.75 8.25 8.25 12.75" />
        </svg>
      </div>

      <p class="text-sm font-semibold uppercase tracking-wider text-primary">404</p>
      <h1 class="mt-1 text-xl font-bold tracking-tight">Page not found</h1>
      <p class="mt-2 text-sm text-muted-foreground">
        The page you're looking for doesn't exist, moved, or the link is out of date.
      </p>

      <div class="mt-6 flex flex-col gap-2">
        <a
          href="index.html"
          class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground hover:bg-primary/90"
        >
          Back to dashboard
        </a>
        <a
          href="tasks.html"
          class="w-full rounded-lg border border-border px-4 py-2.5 text-sm font-medium text-foreground/80 hover:bg-accent"
        >
          Go to all tasks
        </a>
      </div>
    </div>

    <p class="mt-6 text-sm text-muted-foreground">
      Think this is a mistake?
      <a href="#" class="font-semibold text-primary hover:underline">Contact support</a>
    </p>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
